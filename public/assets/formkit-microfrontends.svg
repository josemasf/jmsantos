<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura de FormKit</title>
  <desc id="desc">Un host orquestador conecta tres microfrontends de formularios con sus APIs mock independientes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="host" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4f46e5"/><stop offset="1" stop-color="#0891b2"/></linearGradient>
  </defs>
  <rect width="1200" height="750" rx="40" fill="url(#bg)"/>
  <circle cx="1100" cy="80" r="230" fill="#06b6d4" opacity=".12"/><circle cx="85" cy="700" r="260" fill="#6366f1" opacity=".16"/>
  <text x="80" y="100" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="30" font-weight="700">FormKit · Vue 3 Microfrontends</text>
  <text x="80" y="142" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="20">Formularios federados, configuración runtime y quality gates</text>
  <rect x="390" y="210" width="420" height="115" rx="20" fill="url(#host)"/>
  <text x="600" y="258" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="25" font-weight="700">orchestrator host</text>
  <text x="600" y="290" text-anchor="middle" fill="#dbeafe" font-family="system-ui, sans-serif" font-size="17">Vite Module Federation</text>
  <g stroke="#67e8f9" stroke-width="4" fill="none" opacity=".9"><path d="M600 325V390H190V430"/><path d="M600 325V390H600V430"/><path d="M600 325V390H1010V430"/></g>
  <g font-family="system-ui, sans-serif">
    <g><rect x="70" y="430" width="240" height="105" rx="18" fill="#1e293b" stroke="#22d3ee"/><text x="190" y="475" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700">formkit-app</text><text x="190" y="507" text-anchor="middle" fill="#94a3b8" font-size="16">remote</text></g>
    <g><rect x="480" y="430" width="240" height="105" rx="18" fill="#1e293b" stroke="#22d3ee"/><text x="600" y="475" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700">formkit-app2</text><text x="600" y="507" text-anchor="middle" fill="#94a3b8" font-size="16">remote</text></g>
    <g><rect x="890" y="430" width="240" height="105" rx="18" fill="#1e293b" stroke="#22d3ee"/><text x="1010" y="475" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="700">formkit-app3</text><text x="1010" y="507" text-anchor="middle" fill="#94a3b8" font-size="16">remote</text></g>
    <g fill="#0f766e"><rect x="70" y="610" width="240" height="58" rx="14"/><rect x="480" y="610" width="240" height="58" rx="14"/><rect x="890" y="610" width="240" height="58" rx="14"/></g>
    <g fill="#ecfeff" font-size="18" font-weight="600"><text x="190" y="647" text-anchor="middle">API mock :3000</text><text x="600" y="647" text-anchor="middle">API mock :4002</text><text x="1010" y="647" text-anchor="middle">API mock :4003</text></g>
  </g>
  <g stroke="#5eead4" stroke-width="3" opacity=".75"><path d="M190 535V610"/><path d="M600 535V610"/><path d="M1010 535V610"/></g>
</svg>
