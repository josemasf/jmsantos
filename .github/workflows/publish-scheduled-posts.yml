name: Publicar posts programados

on:
  schedule:
    # 08:00 Europe/Madrid. Se separan los cron para poder identificar cuál
    # corresponde al horario vigente aunque GitHub retrase la ejecución.
    - cron: "0 6 * * 1,2,3,4,6"
    - cron: "0 7 * * 1,2,3,4,6"

  workflow_dispatch:

permissions:
  contents: none

concurrency:
  group: publish-scheduled-posts
  cancel-in-progress: false

jobs:
  check-publication-time:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      should-run: ${{ steps.madrid-time.outputs.should-run }}
    steps:
      - id: madrid-time
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          SHOULD_RUN="$(node -e '
            if (process.env.EVENT_NAME === "workflow_dispatch") {
              console.log(true);
              process.exit(0);
            }

            const now = new Date();
            const madrid = new Date(now.toLocaleString("en-US", { timeZone: "Europe/Madrid" }));
            const utc = new Date(now.toLocaleString("en-US", { timeZone: "UTC" }));
            const offsetHours = Math.round((madrid - utc) / 3_600_000);
            const expectedSchedule = offsetHours === 2
              ? "0 6 * * 1,2,3,4,6"
              : "0 7 * * 1,2,3,4,6";

            console.log(process.env.SCHEDULE === expectedSchedule);
          ')"
          echo "should-run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"

  publish:
    needs: check-publication-time
    if: needs.check-publication-time.outputs.should-run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    env:
      SITE_URL: https://josemariasantos.com
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: master

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.13.0
          package-manager-cache: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:publish

      - name: Detectar posts publicables
        run: pnpm publish:scheduled -- --dry-run > publication.json

      - id: publication
        run: |
          node -e 'const result = JSON.parse(require("node:fs").readFileSync("publication.json", "utf8")); console.log(`count=${result.posts.length}`); console.log(`date=${result.publicationDate}`);' >> "$GITHUB_OUTPUT"

      - name: Mover posts publicables
        if: steps.publication.outputs.count != '0'
        run: pnpm publish:scheduled -- --date "${{ steps.publication.outputs.date }}" > publication.json

      - name: Formatear posts publicados
        if: steps.publication.outputs.count != '0'
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");
          const { posts } = JSON.parse(fs.readFileSync("publication.json", "utf8"));
          const files = posts.map((post) => `src/content/posts/${post.relativePath}`);

          execFileSync("pnpm", ["exec", "oxfmt", ...files], { stdio: "inherit" });
          NODE

      - run: pnpm build

      - name: Confirmar publicación
        if: steps.publication.outputs.count != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/content/drafts/posts src/content/posts
          git commit -m "chore(blog): publicar posts programados"
          git push origin master

      - name: Crear aviso de publicación
        if: steps.publication.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_DATE: ${{ steps.publication.outputs.date }}
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const { posts } = JSON.parse(fs.readFileSync("publication.json", "utf8"));
          const siteUrl = process.env.SITE_URL.replace(/\/$/, "");
          const lines = [
            "## Posts publicados",
            "",
            ...posts.map((post) => `- [${post.title}](${siteUrl}/blog/${post.id}) — ${post.date}`),
            "",
            "Issue creada automáticamente después de publicar el lote en master.",
          ];
          fs.writeFileSync("publication-issue.md", `${lines.join("\n")}\n`);
          NODE
          gh label create "publicación automática" --color "0E8A16" --description "Avisos de posts publicados por el workflow" --force
          issue_url="$(gh issue create --title "Posts publicados: $PUBLICATION_DATE" --label "publicación automática" --body-file publication-issue.md)"
          gh issue close "$issue_url" --reason completed
