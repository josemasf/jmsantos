name: Calidad de contenido

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - run: pnpm install --no-frozen-lockfile
      - name: Mostrar actualización del lockfile para revisión
        run: git diff -- pnpm-lock.yaml
      - name: Diagnosticar resolución de dependencias de Astro
        run: |
          node --input-type=module - <<'NODE'
          import { createRequire } from "node:module";
          const require = createRequire(import.meta.url);
          for (const name of ["@astrojs/check", "typescript"]) {
            try {
              console.log(`Resuelto ${name}: ${require.resolve(name)}`);
              await import(name);
              console.log(`Importado ${name} correctamente`);
            } catch (error) {
              console.error(`No se puede cargar ${name}:`, error);
              process.exitCode = 1;
            }
          }
          NODE
      - run: pnpm lint
      - run: pnpm test:newsletter
      - run: pnpm test:content
      - run: pnpm content:check
      - run: pnpm astro check
      - run: pnpm build
      - run: pnpm content:check -- --built
